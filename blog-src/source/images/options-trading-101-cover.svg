<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Options Trading 101</title>
  <desc id="description">A dark trading-inspired cover with option payoff curves, volatility bands, and market quotes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b2b"/>
      <stop offset="0.52" stop-color="#0b3445"/>
      <stop offset="1" stop-color="#08151f"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="35%" r="55%">
      <stop offset="0" stop-color="#24d6c8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#24d6c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#44ead6"/>
      <stop offset="1" stop-color="#ffc35b"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#b8f4ee" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g opacity=".72" stroke-linecap="round">
    <path d="M780 660H1480M860 760V170" stroke="#a9d9d7" stroke-opacity=".24" stroke-width="3"/>
    <path d="M790 660H1035L1320 250" fill="none" stroke="url(#curve)" stroke-width="12" filter="url(#softGlow)"/>
    <path d="M820 475L985 660L1160 475" fill="none" stroke="#ffc35b" stroke-width="5" stroke-opacity=".8"/>
    <path d="M880 265C1020 210 1185 210 1420 350" fill="none" stroke="#5ee1e7" stroke-width="4" stroke-dasharray="14 18" stroke-opacity=".7"/>
  </g>
  <g fill="#d9fffb" font-family="Inter,Arial,sans-serif">
    <text x="110" y="150" font-size="28" letter-spacing="7" fill="#63e5d7">DERIVATIVES · MARKET MAKING · RISK</text>
    <text x="105" y="295" font-size="92" font-weight="700">Options</text>
    <text x="105" y="395" font-size="92" font-weight="700">Trading 101</text>
    <text x="112" y="475" font-size="31" fill="#a9c7c9">From fair value and edge to volatility, Greeks,</text>
    <text x="112" y="520" font-size="31" fill="#a9c7c9">and dynamic hedging.</text>
  </g>
  <g transform="translate(110 650)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect width="520" height="122" rx="22" fill="#07131c" stroke="#4ce6d6" stroke-opacity=".45"/>
    <text x="34" y="45" fill="#83eee4" font-size="24">BID  7.85</text>
    <text x="205" y="45" fill="#718d93" font-size="24">THEO  8.02</text>
    <text x="401" y="45" fill="#ffd075" font-size="24">ASK  8.20</text>
    <path d="M34 70H486" stroke="#36545d"/>
    <text x="34" y="101" fill="#9bb6ba" font-size="20">Δ 0.52</text>
    <text x="151" y="101" fill="#9bb6ba" font-size="20">Γ 0.018</text>
    <text x="280" y="101" fill="#9bb6ba" font-size="20">Θ -0.07</text>
    <text x="409" y="101" fill="#9bb6ba" font-size="20">V 0.11</text>
  </g>
</svg>
