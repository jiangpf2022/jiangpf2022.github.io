<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Human-led AI workflow</title><desc id="d">AI supplies questions, drafts, and critique inside a loop whose decisions, verification, evidence, and responsibility remain human.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0f8ff"/><stop offset="1" stop-color="#e7f3ef"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#42a88c"/></marker></defs><rect width="1200" height="680" rx="28" fill="url(#b)"/><text x="55" y="65" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" fill="#173d6b">AI accelerates candidates; humans justify conclusions</text><circle cx="600" cy="360" r="145" fill="#173d6b"/><g font-family="Inter,Arial,sans-serif" text-anchor="middle"><text x="600" y="330" font-size="27" font-weight="800" fill="#fff">HUMAN TEAM</text><text x="600" y="370" font-size="21" fill="#dbeeff">decision · evidence</text><text x="600" y="402" font-size="21" fill="#dbeeff">responsibility</text><g fill="#fff" stroke="#42a88c" stroke-width="4"><rect x="80" y="140" width="300" height="115" rx="22"/><rect x="820" y="140" width="300" height="115" rx="22"/><rect x="80" y="500" width="300" height="115" rx="22"/><rect x="820" y="500" width="300" height="115" rx="22"/></g><g font-size="23" font-weight="800" fill="#173d6b"><text x="230" y="188">FRAME + QUESTION</text><text x="970" y="188">DRAFT + IMPLEMENT</text><text x="230" y="548">VERIFY + CRITIQUE</text><text x="970" y="548">DISCLOSE + DOCUMENT</text></g><g font-size="17" fill="#56718e"><text x="230" y="222">AI finds ambiguity</text><text x="970" y="222">AI proposes candidates</text><text x="230" y="582">humans run the tests</text><text x="970" y="582">humans keep the record</text></g></g><g fill="none" stroke="#42a88c" stroke-width="7" marker-end="url(#a)"><path d="M390 200C500 125 700 125 810 200"/><path d="M1030 270C1100 340 1100 435 1030 490"/><path d="M810 560C700 640 500 640 390 560"/><path d="M170 490C95 420 95 330 170 265"/></g></svg>
