<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="t d"><title id="t">Visualization practice loop</title><desc id="d">A four-step loop from observing a strong figure to reconstructing, explaining, and adapting it.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#2f81e4"/></marker></defs><rect width="1100" height="620" rx="28" fill="#eef7ff"/><text x="55" y="65" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" fill="#173d6b">Visual taste is trained through reconstruction</text><g fill="none" stroke="#2f81e4" stroke-width="8" marker-end="url(#a)"><path d="M355 190h330"/><path d="M790 275v115"/><path d="M685 485H355"/><path d="M250 390V275"/></g><g font-family="Inter,Arial,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#65a6e7" stroke-width="4"><rect x="90" y="125" width="270" height="150" rx="24"/><rect x="685" y="125" width="270" height="150" rx="24"/><rect x="685" y="390" width="270" height="150" rx="24"/><rect x="90" y="390" width="270" height="150" rx="24"/></g><g font-size="24" font-weight="800" fill="#173d6b"><text x="225" y="185">Observe</text><text x="820" y="185">Reconstruct</text><text x="820" y="450">Explain</text><text x="225" y="450">Adapt</text></g><g font-size="18" fill="#56718e"><text x="225" y="222">What claim becomes visible?</text><text x="820" y="222">Can you reproduce the choices?</text><text x="820" y="487">Why this encoding and color?</text><text x="225" y="487">Does it work on a new question?</text></g></g></svg>
