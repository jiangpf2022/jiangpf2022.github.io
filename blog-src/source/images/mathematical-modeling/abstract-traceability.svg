" y="540" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d" text-anchor="middle">The chain is only as strong as its weakest interface.</text><text x="600" y="575" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="450" fill="#526b82" text-anchor="middle">Every claim must travel backward to evidence and forward to a decision.</text></svg>