<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Competition toolchain</title><desc id="d">A central verified submission connected to separate knowledge, writing, computation, diagram, and version responsibilities.</desc><rect width="1200" height="650" rx="28" fill="#eef7ff"/><text x="60" y="65" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" fill="#173d6b">Give every tool one responsibility</text><g stroke="#8aaed0" stroke-width="6"><path d="M600 320 235 165M600 320 965 165M600 320 205 475M600 320 995 475"/></g><g font-family="Inter,Arial,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#4f8edc" stroke-width="4"><rect x="70" y="105" width="330" height="125" rx="24"/><rect x="800" y="105" width="330" height="125" rx="24"/><rect x="40" y="415" width="330" height="125" rx="24"/><rect x="830" y="415" width="330" height="125" rx="24"/></g><circle cx="600" cy="320" r="145" fill="#173d6b"/><text x="600" y="300" font-size="27" font-weight="800" fill="#fff">VERIFIED</text><text x="600" y="338" font-size="27" font-weight="800" fill="#fff">SUBMISSION</text><text x="600" y="374" font-size="18" fill="#d7e9fb">one current result</text><g fill="#173d6b" font-size="23" font-weight="800"><text x="235" y="155">Knowledge</text><text x="965" y="155">Writing</text><text x="205" y="465">Computation</text><text x="995" y="465">Diagrams + Files</text></g><g fill="#56718e" font-size="17"><text x="235" y="190">sources · assumptions · decisions</text><text x="965" y="190">narrative · equations · citations</text><text x="205" y="500">raw data · tests · figures</text><text x="995" y="500">flows · versions · handoffs</text></g></g></svg>
