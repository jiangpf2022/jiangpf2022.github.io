<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f5f9fd"/><text x="60" y="70" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="750" fill="#17324d" text-anchor="start">Draining Vessel: Conservation + Geometry</text><text x="60" y="108" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="450" fill="#5c7185" text-anchor="start">The cross-sectional area changes with water depth.</text><path d="M320 205 Q320 590 600 590 Q880 590 880 205" fill="#dceffd" stroke="#17324d" stroke-width="6"/><path d="M365 385 Q380 565 600 565 Q820 565 835 385 Z" fill="#79b5e8" opacity=".8"/><line x1="365" y1="385" x2="835" y2="385" stroke="#3977c5" stroke-width="5" /><text x="850" y="395" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#3977c5" text-anchor="start">h(t)</text><circle cx="600" cy="590" r="12" fill="#17324d" stroke="none" stroke-width="0"/><line x1="600" y1="610" x2="600" y2="665" stroke="#3977c5" stroke-width="4" /><polygon points="600,665 585,656 585,674" fill="#3977c5"/><rect x="80" y="235" width="290" height="155" rx="18" fill="#fff" stroke="#dce8f3" stroke-width="2"/><text x="110" y="280" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#17324d" text-anchor="start">Volume balance</text><text x="110" y="330" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="650" fill="#3977c5" text-anchor="start">A(h) dh/dt = −Q(h)</text><text x="110" y="370" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="650" fill="#39a6a3" text-anchor="start">Q(h) ∝ √h</text><text x="600" y="690" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d" text-anchor="middle">The nonlinearity comes from both outflow physics and vessel shape.</text></svg>