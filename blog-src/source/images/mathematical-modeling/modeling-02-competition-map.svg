<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Competition workflow map</title><desc id="d">Six connected stages from selection to submission with verification returning to every stage.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff8ff"/><stop offset="1" stop-color="#dceaff"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#4f8edc"/></marker></defs><rect width="1200" height="650" rx="28" fill="url(#b)"/><text x="60" y="65" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" fill="#173d6b">One evidence chain, not six separate tasks</text><g font-family="Inter,Arial,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#4f8edc" stroke-width="4"><rect x="70" y="140" width="280" height="120" rx="22"/><rect x="460" y="140" width="280" height="120" rx="22"/><rect x="850" y="140" width="280" height="120" rx="22"/><rect x="850" y="370" width="280" height="120" rx="22"/><rect x="460" y="370" width="280" height="120" rx="22"/><rect x="70" y="370" width="280" height="120" rx="22"/></g><g font-size="24" font-weight="800" fill="#173d6b"><text x="210" y="192">1 · Select</text><text x="600" y="192">2 · Frame</text><text x="990" y="192">3 · Compute</text><text x="990" y="422">4 · Validate</text><text x="600" y="422">5 · Communicate</text><text x="210" y="422">6 · Submit</text></g><g font-size="18" fill="#56718e"><text x="210" y="228">fit + evidence path</text><text x="600" y="228">contract + baseline</text><text x="990" y="228">code + results</text><text x="990" y="458">tests + stress cases</text><text x="600" y="458">figures + narrative</text><text x="210" y="458">PDF + disclosure</text></g></g><g stroke="#4f8edc" stroke-width="7" fill="none" marker-end="url(#a)"><path d="M360 200h85"/><path d="M750 200h85"/><path d="M990 275v75"/><path d="M835 430h-80"/><path d="M445 430h-80"/></g><path d="M210 510C210 600 990 600 990 510" fill="none" stroke="#e49a3d" stroke-width="7" stroke-dasharray="12 9" marker-end="url(#a)"/><text x="600" y="590" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#a75d18">Verification can force revision at any earlier stage</text></svg>
