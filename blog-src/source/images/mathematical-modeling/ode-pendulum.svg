<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f5f9fd"/><text x="60" y="70" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="750" fill="#17324d" text-anchor="start">Pendulum: From Forces to an ODE</text><text x="60" y="108" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="450" fill="#5c7185" text-anchor="start">Gravity creates angular acceleration; the small-angle model is an approximation.</text><line x1="600" y1="170" x2="600" y2="220" stroke="#273444" stroke-width="6" /><line x1="600" y1="220" x2="805" y2="455" stroke="#3977c5" stroke-width="8" /><circle cx="805" cy="455" r="35" fill="#f2b84b" stroke="#17324d" stroke-width="4"/><line x1="600" y1="220" x2="600" y2="520" stroke="#dce8f3" stroke-width="3" stroke-dasharray="8 8"/><path d="M600 315 A95 95 0 0 0 664 290" fill="none" stroke="#e56b6f" stroke-width="5"/><text x="668" y="290" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#e56b6f" text-anchor="start">θ</text><line x1="805" y1="455" x2="805" y2="555" stroke="#e56b6f" stroke-width="4" /><polygon points="805,555 790,546 790,564" fill="#e56b6f"/><text x="825" y="535" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#e56b6f" text-anchor="start">mg</text><rect x="105" y="230" width="350" height="205" rx="18" fill="#fff" stroke="#dce8f3" stroke-width="2"/><text x="135" y="280" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d" text-anchor="start">Exact model</text><text x="135" y="325" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="650" fill="#3977c5" text-anchor="start">θ¨ + (g/L) sin θ = 0</text><text x="135" y="380" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#17324d" text-anchor="start">Small-angle model</text><text x="135" y="422" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="650" fill="#39a6a3" text-anchor="start">θ¨ + (g/L) θ = 0</text><text x="600" y="650" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="650" fill="#17324d" text-anchor="middle">Always state the amplitude range before using sin θ ≈ θ.</text></svg>