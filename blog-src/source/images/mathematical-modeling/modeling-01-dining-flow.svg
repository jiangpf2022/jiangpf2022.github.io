<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Dining hall bottleneck and worker assignment</title>
  <desc id="desc">Customers flow through payment, preparation, and pickup stations; the minimum station capacity determines throughput.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4faff"/><stop offset="1" stop-color="#e1edff"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#4f8edc"/></marker></defs>
  <rect width="1200" height="600" rx="28" fill="url(#bg)"/>
  <text x="65" y="67" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#173d6b">Service flow: total throughput is controlled by the bottleneck</text>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(65 185)"><circle cx="55" cy="35" r="18" fill="#ffc857"/><circle cx="100" cy="35" r="18" fill="#ffc857"/><circle cx="145" cy="35" r="18" fill="#ffc857"/><path d="M55 55v50M100 55v50M145 55v50" stroke="#244b75" stroke-width="8"/><text x="100" y="155" font-size="23" font-weight="700" fill="#173d6b">60 arrivals</text></g>
    <g transform="translate(300 145)"><rect width="220" height="210" rx="22" fill="#fff" stroke="#e05a47" stroke-width="5"/><text x="110" y="50" font-size="24" font-weight="700" fill="#173d6b">Payment</text><text x="110" y="105" font-size="42" font-weight="800" fill="#e05a47">25</text><text x="110" y="142" font-size="18" fill="#56718e">customers / 30 min</text><text x="110" y="183" font-size="17" font-weight="700" fill="#e05a47">BOTTLENECK</text></g>
    <g transform="translate(610 145)"><rect width="220" height="210" rx="22" fill="#fff" stroke="#4f8edc" stroke-width="4"/><text x="110" y="50" font-size="24" font-weight="700" fill="#173d6b">Preparation</text><text x="110" y="105" font-size="42" font-weight="800" fill="#2f81e4">40</text><text x="110" y="142" font-size="18" fill="#56718e">customers / 30 min</text></g>
    <g transform="translate(920 145)"><rect width="220" height="210" rx="22" fill="#fff" stroke="#4f8edc" stroke-width="4"/><text x="110" y="50" font-size="24" font-weight="700" fill="#173d6b">Pickup</text><text x="110" y="105" font-size="42" font-weight="800" fill="#2f81e4">80</text><text x="110" y="142" font-size="18" fill="#56718e">customers / 30 min</text></g>
  </g>
  <path d="M220 250H290M530 250H600M840 250H910" stroke="#4f8edc" stroke-width="8" marker-end="url(#a)"/>
  <rect x="250" y="420" width="700" height="115" rx="22" fill="#173d6b"/><text x="600" y="463" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#fff">A fourth worker changes one station—not the whole chain.</text><text x="600" y="502" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#dbeeff">Evaluate the new minimum capacity before claiming that waiting disappears.</text>
</svg>
