<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Commuter invariant</title><desc id="desc">A route diagram shows that ten minutes saved on the round trip corresponds to five minutes of driving avoided in each direction.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#2f81e4"/></marker></defs>
  <rect width="1000" height="560" rx="28" fill="#edf7ff"/><text x="55" y="65" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#173d6b">Round-trip time invariant</text>
  <path d="M120 300H880" stroke="#9db9d1" stroke-width="18" stroke-linecap="round"/>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle"><path d="M80 305 160 235 240 305V405H80Z" fill="#fff" stroke="#4f8edc" stroke-width="4"/><text x="160" y="445" font-size="22" font-weight="700" fill="#173d6b">Home</text><rect x="785" y="225" width="150" height="170" rx="12" fill="#fff" stroke="#4f8edc" stroke-width="4"/><text x="860" y="445" font-size="22" font-weight="700" fill="#173d6b">Station</text><circle cx="585" cy="302" r="20" fill="#ef8c3b"/><text x="585" y="355" font-size="20" font-weight="700" fill="#a55418">Meeting point</text></g>
  <path d="M175 260H565" stroke="#2f81e4" stroke-width="8" marker-end="url(#a)"/><path d="M565 340H175" stroke="#2f81e4" stroke-width="8" marker-end="url(#a)"/>
  <path d="M600 245H835" stroke="#e05a47" stroke-width="7" stroke-dasharray="13 9"/><path d="M835 360H600" stroke="#e05a47" stroke-width="7" stroke-dasharray="13 9"/>
  <g font-family="Inter,Arial,sans-serif"><text x="710" y="218" text-anchor="middle" font-size="20" font-weight="700" fill="#b74637">5 min avoided</text><text x="710" y="405" text-anchor="middle" font-size="20" font-weight="700" fill="#b74637">5 min avoided</text><rect x="210" y="490" width="580" height="45" rx="14" fill="#173d6b"/><text x="500" y="520" text-anchor="middle" font-size="20" fill="#fff">10 minutes saved = 2 × 5 minutes of driving</text></g>
</svg>
