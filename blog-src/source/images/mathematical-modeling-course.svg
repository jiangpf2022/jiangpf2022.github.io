<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mathematical Modeling</title>
  <desc id="desc">A blue and violet mathematical landscape of data, optimization contours, and connected models.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b38"/>
      <stop offset="0.52" stop-color="#123d69"/>
      <stop offset="1" stop-color="#392b74"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="23%" r="58%">
      <stop offset="0" stop-color="#62d9ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#62d9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#58e3c3"/>
      <stop offset=".55" stop-color="#78c8ff"/>
      <stop offset="1" stop-color="#d396ff"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#b8dcff" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1210" cy="170" r="115" fill="#78d8ff" opacity=".12" filter="url(#blur)"/>
  <circle cx="340" cy="690" r="150" fill="#8f7cff" opacity=".15" filter="url(#blur)"/>

  <g fill="none" stroke="url(#line)" stroke-linecap="round">
    <path d="M90 706 C225 620 300 680 398 555 S603 350 752 440 948 642 1081 507 1274 250 1510 302" stroke-width="10" opacity=".9"/>
    <path d="M90 748 C278 714 405 730 535 626 S727 482 880 546 1100 661 1260 520 1415 388 1510 410" stroke-width="3" opacity=".45"/>
  </g>

  <g fill="#dff8ff" stroke="#7ce7dd" stroke-width="4">
    <circle cx="192" cy="651" r="13"/><circle cx="398" cy="555" r="13"/>
    <circle cx="752" cy="440" r="13"/><circle cx="1081" cy="507" r="13"/>
    <circle cx="1326" cy="278" r="13"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#f5fbff">
    <text x="112" y="190" font-size="34" letter-spacing="8" fill="#79e5d1">MODEL • TEST • EXPLAIN</text>
    <text x="108" y="292" font-size="82" font-weight="750">Mathematical</text>
    <text x="108" y="382" font-size="82" font-weight="750">Modeling</text>
    <text x="112" y="438" font-size="27" fill="#c6daf0">From real questions to defensible decisions</text>
  </g>

  <g font-family="Georgia, serif" font-size="33" fill="#d9ecff" opacity=".82">
    <text x="1120" y="690">min f(x)</text>
    <text x="1120" y="738">s.t. g(x) ≤ 0</text>
    <text x="1118" y="786">ẋ = F(x,t)</text>
  </g>
</svg>
